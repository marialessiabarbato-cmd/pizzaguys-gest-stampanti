name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm exec turbo build --filter='!./apps/cloud-web' --filter='!./apps/edge-web' --filter='!./apps/handheld-web' --filter='!./apps/kds-web'

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
